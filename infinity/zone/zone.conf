; Zone-wide server config. Read once at server startup.
;
; [Startup] AutoLoad — comma-/whitespace-separated list of arena folder names
; under zone/arenas/ to bring up when the server starts. Each listed arena is
; marked "desired" and the ArenaSystem reconciler loads it on the first tick.
; Chat commands (~loadArena, ~unloadMap) mutate the same desired state at
; runtime.
;
; [ZoneEnterSpawn] Arena — name of the loaded arena whose [Spawn] X/Z (arena-local
; coords) is used as the world-space spawn point for new player sessions on first
; connect. Must be one of the arenas in [Startup] AutoLoad above (or otherwise
; loaded by the time a session connects). The world coord is computed by
; ArenaSystem.getArenaSpawn(arenaName) = ArenaMap.min + (X, Z) on GAMEPLAY_Y.
;
; Per-arena [Spawn] in arena.conf is also used for in-arena respawn (ship change,
; death) — keyed off the ship's *current* ArenaId, which doesn't exist at
; connect time. Connect-time uses this single zone-level pointer to pick
; *which* arena's [Spawn] to read.

[Startup]
AutoLoad=trench,deva

[ZoneEnterSpawn]
Arena=trench
