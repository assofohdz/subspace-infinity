; Zone-wide server config. Read once by ArenaSystem at server startup.
;
; [Startup] AutoLoad — comma-/whitespace-separated list of arena folder names
; under zone/arenas/ to bring up when the server starts. Each listed arena is
; marked "desired" and the ArenaSystem reconciler loads it on the first tick.
; Chat commands (~loadArena, ~unloadMap) mutate the same desired state at
; runtime.

[Startup]
AutoLoad=trench
