plugins {
	id 'infinity.published-library'
}

dependencies {
	// Simsilica
	implementation "com.simsilica:sim-math:$simMathVersion"
	implementation "com.simsilica:sim-ethereal:$simEtherealVersion"
	implementation "com.simsilica:zay-es:$zayEsVersion"
	implementation "com.simsilica:sio2:$sio2Version"
    implementation "com.simsilica:bpos:$mossVersion"

	// Simsilica MOSS — mworld supplies WorldGrids referenced by InfinityConstants.
	implementation "com.simsilica:mworld:$mossVersion"
	implementation "com.simsilica:sio2-mphys:$mossVersion"

	// jME networking — RMI session interfaces in infinity.net (GameSession,
	// ChatSession, AccountSession) carry @Asynchronous annotations and use
	// HostedConnection from this module.
	implementation "org.jmonkeyengine:jme3-networking:$jmeVersion"

    implementation "com.google.code.findbugs:jsr305:3.0.2"

    // Test-only — JUnit 4 matches the existing project test style
    // (MapSwapReproducerTest, infinity-side factory tests) per
    // .scratch/spawn-projection-test-harness/PRD.md. The api-side factory
    // tests parametrize PhysicsSpace<EntityId, MBlockShape>, so
    // mblock-physb is on the test classpath only — main api code uses
    // PhysicsSpace<?, ?> and stays mblock-free.
    testImplementation "com.simsilica:mblock-physb:$mossVersion"
}