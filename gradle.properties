# Static-analysis ceilings — captured baseline per-module per-tool.
#
# Each tool runs warn-only at task level (ignoreFailures = true in
# buildSrc/src/main/groovy/infinity.java-conventions.gradle) so the
# per-touched-file ratchet (.claude/rules/pmd-on-touched-files.md) and
# per-batch refactor work don't break every commit on existing baseline
# violations. The ceilings below are the gate: any count ABOVE the
# captured baseline fails the build.
#
# To ratchet down: after a cleanup batch reduces the real count, capture
# the new count, lower the matching property here, commit. Bumping a
# ceiling is an explicit property edit — never silent.
#
# Out of scope (TODO): Error Prone + NullAway warnings flow through
# javac stdout, not separate report files; ratcheting them needs a
# different mechanism (parse javac output) and is left for a follow-up.

# api
# bumped from 37 → 38 when TodoComment + HiddenField added 2026-05-14.
maxApiCheckstyleViolations=38
maxApiPmdViolations=0
# baseline as of 2026-05-11; ratchet down via .claude/rules/pmd-on-touched-files.md
maxApiPmdTestViolations=0

# infinity-server (split from former :infinity per arch-review #11)
# Property names contain literal hyphens — Gradle accepts them; the
# infinity.java-conventions ceiling lookup is `max${project.name.capitalize()}...`,
# which yields `Infinity-server` / `Infinity-client` for these projects.
# bumped from 556 → 570 when TodoComment + HiddenField added 2026-05-14.
maxInfinity-serverCheckstyleViolations=570
maxInfinity-serverCheckstyleTestViolations=16
# baseline as of 2026-05-14; ratchet down via .claude/rules/pmd-on-touched-files.md
# ratcheted to 0 after the new-rule cleanup pass 2026-05-14.
maxInfinity-serverPmdViolations=0
# baseline as of 2026-05-14; ratchet down via .claude/rules/pmd-on-touched-files.md
maxInfinity-serverPmdTestViolations=0

# infinity-client (split from former :infinity per arch-review #11)
# bumped from 340 → 343 when TodoComment + HiddenField added 2026-05-14.
maxInfinity-clientCheckstyleViolations=343
# bumped from 0 → 2 when TodoComment + HiddenField added 2026-05-14.
maxInfinity-clientCheckstyleTestViolations=2
# baseline as of 2026-05-14; ratchet down via .claude/rules/pmd-on-touched-files.md
# ratcheted to 0 after the new-rule cleanup pass 2026-05-14.
maxInfinity-clientPmdViolations=0
# baseline as of 2026-05-14; ratchet down via .claude/rules/pmd-on-touched-files.md
maxInfinity-clientPmdTestViolations=0

# modules — no test sources, pmdTest is NO-SOURCE; no ceiling needed.
maxModulesCheckstyleViolations=12
maxModulesPmdViolations=0
