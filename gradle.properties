# Static-analysis ceilings — captured baseline per-module per-tool.
#
# Each tool runs warn-only at task level (ignoreFailures = true in
# buildSrc/src/main/groovy/infinity.java-conventions.gradle) so the
# per-touched-file ratchet (.claude/rules/pmd-on-touched-files.md) and
# per-batch refactor work don't break every commit on existing baseline
# violations. The ceilings below are the gate: any count ABOVE the
# captured baseline fails the build.
#
# To ratchet down: after a cleanup batch reduces the real count, capture
# the new count, lower the matching property here, commit. Bumping a
# ceiling is an explicit property edit — never silent.
#
# Out of scope (TODO): Error Prone + NullAway warnings flow through
# javac stdout, not separate report files; ratcheting them needs a
# different mechanism (parse javac output) and is left for a follow-up.

# api
# ratcheted 12 → 2 after the 2026-05-14 TODO/FIXME triage sweep.
maxApiCheckstyleViolations=2
maxApiPmdViolations=0
# baseline as of 2026-05-11; ratchet down via .claude/rules/pmd-on-touched-files.md
maxApiPmdTestViolations=0

# infinity-server (split from former :infinity per arch-review #11)
# Property names contain literal hyphens — Gradle accepts them; the
# infinity.java-conventions ceiling lookup is `max${project.name.capitalize()}...`,
# which yields `Infinity-server` / `Infinity-client` for these projects.
# ratcheted 79 → 55 after the 2026-05-14 TODO/FIXME triage sweep.
maxInfinity-serverCheckstyleViolations=55
# ratcheted 16 → 0 after the 2026-05-14 sweep (FinalParametersCheck cleared in MapSwapReproducerTest).
maxInfinity-serverCheckstyleTestViolations=0
# baseline as of 2026-05-14; ratchet down via .claude/rules/pmd-on-touched-files.md
# ratcheted to 0 after the new-rule cleanup pass 2026-05-14.
maxInfinity-serverPmdViolations=0
# baseline as of 2026-05-14; ratchet down via .claude/rules/pmd-on-touched-files.md
maxInfinity-serverPmdTestViolations=0

# infinity-client (split from former :infinity per arch-review #11)
# ratcheted 27 → 21 after the 2026-05-14 TODO/FIXME triage sweep.
maxInfinity-clientCheckstyleViolations=21
# ratcheted 2 → 1 after the 2026-05-14 sweep.
maxInfinity-clientCheckstyleTestViolations=1
# baseline as of 2026-05-14; ratchet down via .claude/rules/pmd-on-touched-files.md
# ratcheted to 0 after the new-rule cleanup pass 2026-05-14.
maxInfinity-clientPmdViolations=0
# baseline as of 2026-05-14; ratchet down via .claude/rules/pmd-on-touched-files.md
maxInfinity-clientPmdTestViolations=0

# modules — no test sources, pmdTest is NO-SOURCE; no ceiling needed.
maxModulesCheckstyleViolations=12
maxModulesPmdViolations=0

# JaCoCo coverage floors — captured baseline per-module.
#
# Same ratchet shape as PMD/Checkstyle ceilings above: JaCoCo runs warn-only at
# task level; the violationRule in buildSrc/.../infinity.java-conventions.gradle
# fails the build if coverage drops below the captured baseline. Properties
# below are MINIMUMS (coverage must stay AT or ABOVE), unlike the
# PMD/Checkstyle ceilings (counts must stay AT or BELOW). Values are
# fractional (0.0–1.0).
#
# To ratchet up: after a test-addition batch raises real coverage, capture
# the new minimum (read build/reports/jacoco/test/jacocoTestReport.xml at
# the report-level LINE/BRANCH counters), raise the matching property here,
# commit. Lowering is explicit. Missing property = 0.0 (no gate).
#
# Captured 2026-05-14 from `./gradlew clean test jacocoTestReport`.

# api — line 17.37% / branch 16.46% (rounded down). Recaptured after
# the F2.5 (commit de0e8102) `ShipRestrictionsConfig` rip-out + the
# F2.7-followup (commit df096dd1) orphan-test cleanup: the deleted
# `ShipRestrictionsConfigTest` was contributing ~6pp of api branch
# coverage on top of an already-gone production class. Threshold drop
# is explicit per the in-source ratchet policy and reflects the
# honest current floor.
minApiLineCoverage=0.16
minApiBranchCoverage=0.16

# infinity-server — line 30.52% / branch 25.71% (rounded down).
# Recaptured after the shape-interface consolidation (commits 29a02fe7 +
# e921bf09): 4 generic base classes (BaseInventoryCountSystem /
# BaseToggleSystem / BaseWeaponLevelSystem / BaseEnergyDrainSystem) replaced
# 14 carbon-copy systems, structurally redistributing test attribution; the
# 30+ new lines of inventory-decrement helpers in WeaponsEligibility landed
# uncovered alongside ~80 LOC of pre-existing untested bombSafetyClear paths.
# Net: 26 new tests added (WeaponsEligibilityTest, StatusDrainSystemIntegrationTest)
# recovered ~150 covered lines + 70 branches but didn't fully overshoot
# the pre-refactor 0.31/0.26 baseline. Ratcheting bombSafetyClear coverage
# back up requires a PhysicsSpace fixture — backlogged.
minInfinity-serverLineCoverage=0.30
minInfinity-serverBranchCoverage=0.25

# infinity-client — line 5.82% / branch 2.65% (rounded down) after the
# P1-i client-lifecycle test sweep added 4 leak-fix lifecycle tests against
# the headless GuiGlobals fixture. Previous: 3.83% / 1.81%.
minInfinity-clientLineCoverage=0.05
minInfinity-clientBranchCoverage=0.02
