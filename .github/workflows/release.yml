# Build native installers and publish to GitHub Releases and itch.io
# Triggered on version tags (v1.0.0, v1.2.3, etc.) or manual dispatch

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # Build native packages for each OS
  build-native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            ext: exe
          - os: ubuntu-latest
            platform: linux
            ext: deb
          - os: macos-latest
            platform: mac
            ext: dmg

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version in build.gradle
        shell: bash
        run: |
          sed -i.bak 's/version = ".*"/version = "${{ steps.version.outputs.VERSION }}"/' infinity/build.gradle

      - name: Build with Gradle
        run: ./gradlew :infinity:build

      - name: Create app image (for itch.io)
        run: ./gradlew :infinity:jpackageImage

      - name: Create native installer (for GitHub releases)
        run: ./gradlew :infinity:jpackage

      - name: Upload app image for itch.io
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: infinity/build/jpackage-image/*
          retention-days: 7

      - name: Upload installer for GitHub releases
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: infinity/build/jpackage/*
          retention-days: 7

  # Create GitHub Release
  create-release:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      - name: List installers
        run: ls -la installers/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Subspace-Infinity v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: installers/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Push to itch.io
  publish-itchio:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download Windows app
        uses: actions/download-artifact@v4
        with:
          name: app-windows
          path: windows

      - name: Download Linux app
        uses: actions/download-artifact@v4
        with:
          name: app-linux
          path: linux

      - name: Download Mac app
        uses: actions/download-artifact@v4
        with:
          name: app-mac
          path: mac

      - name: Push Windows to itch.io
        uses: Ayowel/butler-to-itch@v1
        with:
          butler_key: ${{ secrets.BUTLER_API_KEY }}
          itch_user: assofohdz
          itch_game: subspace-infinity
          version: ${{ steps.version.outputs.VERSION }}
          files: |
            windows windows/*

      - name: Push Linux to itch.io
        uses: Ayowel/butler-to-itch@v1
        with:
          butler_key: ${{ secrets.BUTLER_API_KEY }}
          itch_user: assofohdz
          itch_game: subspace-infinity
          version: ${{ steps.version.outputs.VERSION }}
          files: |
            linux linux/*

      - name: Push Mac to itch.io
        uses: Ayowel/butler-to-itch@v1
        with:
          butler_key: ${{ secrets.BUTLER_API_KEY }}
          itch_user: assofohdz
          itch_game: subspace-infinity
          version: ${{ steps.version.outputs.VERSION }}
          files: |
            mac mac/*
