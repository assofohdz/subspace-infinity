name: actionlint

on:
  push:
    branches: [ "infinity" ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ "infinity" ]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_on_error: true
