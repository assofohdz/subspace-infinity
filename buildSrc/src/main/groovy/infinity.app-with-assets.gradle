plugins {
    id 'infinity.java-conventions'
    id 'application'
}

// Game data (assets/, zone/) lives at the *project root*. Two consumption
// shapes are wired:
//
// 1. In-JAR via srcDirs — keeps classpath-based loaders (GroovyFragmentLoader,
//    AssetManager classpath fallback) working. Files end up in build/resources/
//    main/ and inside the module JAR.
//
// 2. External (filesystem) via distributions.main.contents — places assets/
//    and zone/ at the dist-zip root alongside bin/ and lib/, where players
//    can find and authors can edit. Each consuming module additionally
//    registers a FileLocator at runtime so AssetManager-routed loads see
//    the external (editable) copy first.
//
// Run tasks (run/runX11/runMac/test) set workingDir = rootProject.projectDir
// so dev mode finds the external copies at the same relative path as in
// production.
sourceSets {
    main {
        resources {
            srcDirs += [rootProject.file('assets'), rootProject.file('zone')]
            excludes += [
                "**/*.psd",
                "**/*.glb",
                "**/*.gltf"
            ]
            //includes += [
            //    "**/*.bset",
            //    "**/*.blocks",
            //    "**/*.fset",
            //    "**/*.ogg",
            //    "**/*.wav",
            //    "**/*.png",
