plugins {
    id 'infinity.java-conventions'
    id 'application'
}

// Game data lives at the *project root*. Two distinct consumption shapes:
//
// 1. assets/ — bundled both ways: in-JAR via srcDirs (keeps AssetManager
//    classpath fallback working for jME materials/shaders/sounds) AND
//    copied to dist-zip root via distributions.main.contents. The
//    consuming module additionally registers a FileLocator at runtime so
//    AssetManager-routed loads see the external (editable) copy first.
//
// 2. zone/ — dist-root ONLY (NOT in-JAR). GroovySettingsHost.readSource
//    resolves Paths.get("zone", relative) against the JVM working dir
//    filesystem-first, so a single canonical copy on disk avoids
//    "which copy am I editing?" ambiguity for operator hot-reload of
//    Groovy presets. Distribution copies zone/ to dist-zip root so the
//    same filesystem lookup works in production.
//
// Run tasks (run/runX11/runMac/test) set workingDir = rootProject.projectDir
// so dev mode finds the external copies at the same relative path as in
// production.
sourceSets {
    main {
        resources {
            srcDirs += [rootProject.file('assets')]
            excludes += [
                "**/*.psd",
                "**/*.glb",
                "**/*.gltf"
            ]
            //includes += [
            //    "**/*.bset",
            //    "**/*.blocks",
            //    "**/*.fset",
            //    "**/*.ogg",
            //    "**/*.wav",
