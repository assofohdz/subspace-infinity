plugins {
    id 'infinity.app-with-assets'
    id 'com.github.ben-manes.versions' version '0.51.0'
}

// =============================================================================
// Fat client — jME rendering + Lemur UI + can co-host a local GameServer via
// HostState. Carries: client/, Main.java.
// Depends on: api/ (compile), infinity-server/ (compile — the HostState bridge
// + constants referenced from client states), modules/ (runtime, transitively
// from infinity-server).
// =============================================================================

mainClassName = "infinity.Main"

// Redirect JVM fatal-error logs (hs_err_pid*.log) to build/crash-logs/ so they
// don't clutter the repo root. Swept by `./gradlew clean`.
def crashLogDir = layout.buildDirectory.dir("crash-logs").get().asFile
crashLogDir.mkdirs()
applicationDefaultJvmArgs = [
    "-Xmx1024m", "-Xms512m", "-XX:MaxDirectMemorySize=1024m",
    "--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED",
    "-XX:ErrorFile=${crashLogDir}/hs_err_pid%p.log",
    // Route java.util.logging → log4j2 (paired with the log4j-jul runtime dep
    // above). Must be set before any j.u.l class is touched, hence here in
    // the JVM args rather than at runtime.
    "-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager"
]

// Force X11 mode for LWJGL3 on Wayland systems (fixes EGL window creation issues)
tasks.register('runX11', JavaExec) {
    group = 'application'
    description = 'Run the game with X11 backend (Wayland fix)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = mainClassName
    jvmArgs = applicationDefaultJvmArgs
    environment 'WAYLAND_DISPLAY', ''
}

// macOS requires GLFW to live on the JVM's first/main thread; without
// -XstartOnFirstThread the LWJGL window creation aborts.
tasks.register('runMac', JavaExec) {
    group = 'application'
    description = 'Run the game on macOS (-XstartOnFirstThread)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = mainClassName
    jvmArgs = applicationDefaultJvmArgs + ['-XstartOnFirstThread']
}

// GameServer writes a persistent block-world cache to world.db/ (relative to
// the JVM working dir). Wipe on `clean`.
clean {
    delete 'world.db'
}

// The legacy infinity.app-with-assets convention plugin sweeps assets/ and
// zone/ from the *current module's* root. Since assets and zone still live
// under infinity/, redirect resource roots here.
sourceSets {
    main {
        resources {
            srcDirs = [
                rootProject.file('infinity/assets'),
                rootProject.file('infinity/zone')
            ]
            excludes += [
                "**/*.psd",
                "**/*.glb",
                "**/*.gltf"
            ]
        }
    }
}

dependencies {
    // logging
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "org.apache.logging.log4j:log4j-api:$log4jVersion"
    implementation "org.apache.logging.log4j:log4j-core:$log4jVersion"
    runtimeOnly "org.apache.logging.log4j:log4j-slf4j-impl:$log4jVersion"
    runtimeOnly "org.apache.logging.log4j:log4j-jul:$log4jVersion"

    implementation "com.google.code.findbugs:jsr305:3.0.2"

    // Ini4j (legacy arena.conf path; phasing out)
    implementation "org.ini4j:ini4j:0.5.4"

    // For Lemur styles
    implementation "org.codehaus.groovy:groovy-all:${groovyVersion}"

    // jMonkeyEngines — full rendering stack
    implementation "org.jmonkeyengine:jme3-core:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-desktop:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-effects:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-plugins:$jmeVersion"

    // Simsilica — full client stack incl. Lemur UI
    implementation "com.simsilica:lemur:$lemurVersion"
    implementation "com.simsilica:lemur-proto:$lemurProtoVersion"
    implementation "com.simsilica:lemur-props:$lemurPropsVersion"
    implementation "com.simsilica:pager:$pagerVersion"
    implementation "com.simsilica:sim-ethereal:$simEtherealVersion"
    implementation "com.simsilica:sim-fx:$simFxVersion"
    implementation "com.simsilica:sim-math:$simMathVersion"
    implementation "com.simsilica:sio2:$sio2Version"
    implementation "com.simsilica:zay-es:$zayEsVersion"
    implementation "com.simsilica:zay-es-net:$zayEsNetVersion"

    // Simsilica MOSS
    implementation "com.simsilica:mblock:$mossVersion"
    implementation "com.simsilica:mblock-physb:$mossVersion"
    implementation "com.simsilica:mworld:$mossVersion"
    implementation "com.simsilica:sio2-mblock:$mossVersion"
    implementation "com.simsilica:sio2-mphys:$mossVersion"
    implementation "com.simsilica:bpos:$mossVersion"
    implementation "com.simsilica:crig:$mossVersion"

    // Local dependencies — HostState bridges into GameServer (server module)
    implementation project(":api")
    implementation project(":infinity-server")
    runtimeOnly project(":modules")

    // Test-only — architecture boundary enforcement (LayerDependencyTest needs
    // both client and server bytecode on the test classpath)
    testImplementation "com.tngtech.archunit:archunit-junit4:1.4.2"
    testImplementation project(":modules")
}

distributions {
    main {
        distributionBaseName = "infinity"
    }
}

// =============================================================================
// jpackage - Native application bundling (replacement for parcl)
// Identical to the previous infinity/build.gradle wiring; this is now the
// fat-client distribution target.
// =============================================================================

def jpackageOutputDir = layout.buildDirectory.dir("jpackage")
def jpackageImageDir = layout.buildDirectory.dir("jpackage-image")

tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = 'Creates a native application image using jpackage (no installer)'
    dependsOn installDist

    def installDir = tasks.installDist.destinationDir
    def os = org.gradle.internal.os.OperatingSystem.current()

    doFirst {
        jpackageImageDir.get().asFile.mkdirs()
    }

    executable = 'jpackage'
    args = [
        '--type', 'app-image',
        '--name', 'Subspace-Infinity',
        '--app-version', version,
        '--vendor', 'Asser Fahrenholz',
        '--copyright', 'Copyright 2024 Asser Fahrenholz',
        '--description', 'A Subspace/Continuum-inspired space shooter',
        '--input', "${installDir}/lib",
        '--main-jar', "infinity-client-${version}.jar",
        '--main-class', mainClassName,
        '--dest', jpackageImageDir.get().asFile.absolutePath,
        '--java-options', '-Xmx1024m',
        '--java-options', '-Xms512m',
        '--java-options', '-XX:MaxDirectMemorySize=1024m',
        '--java-options', '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED',
        '--java-options', '-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager'
    ]

    def iconFile = os.isWindows() ? rootProject.file('infinity/src/main/resources/icon.ico') :
                   os.isMacOsX() ? rootProject.file('infinity/src/main/resources/icon.icns') :
                   rootProject.file('infinity/src/main/resources/icon.png')
    if (iconFile.exists()) {
        args += ['--icon', iconFile.absolutePath]
    }
}

tasks.register('jpackage', Exec) {
    group = 'distribution'
    description = 'Creates a native installer using jpackage'
    dependsOn installDist

    def installDir = tasks.installDist.destinationDir
    def os = org.gradle.internal.os.OperatingSystem.current()

    doFirst {
        jpackageOutputDir.get().asFile.mkdirs()
    }

    executable = 'jpackage'
    args = [
        '--name', 'Subspace-Infinity',
        '--app-version', version,
        '--vendor', 'Asser Fahrenholz',
        '--copyright', 'Copyright 2024 Asser Fahrenholz',
        '--description', 'A Subspace/Continuum-inspired space shooter',
        '--input', "${installDir}/lib",
        '--main-jar', "infinity-client-${version}.jar",
        '--main-class', mainClassName,
        '--dest', jpackageOutputDir.get().asFile.absolutePath,
        '--java-options', '-Xmx1024m',
        '--java-options', '-Xms512m',
        '--java-options', '-XX:MaxDirectMemorySize=1024m',
        '--java-options', '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED',
        '--java-options', '-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager'
    ]

    if (os.isWindows()) {
        args += ['--type', 'exe', '--win-shortcut', '--win-menu', '--win-dir-chooser']
    } else if (os.isMacOsX()) {
        args += ['--type', 'dmg']
    } else {
        args += ['--type', 'deb']
    }

    def iconFile = os.isWindows() ? rootProject.file('infinity/src/main/resources/icon.ico') :
                   os.isMacOsX() ? rootProject.file('infinity/src/main/resources/icon.icns') :
                   rootProject.file('infinity/src/main/resources/icon.png')
    if (iconFile.exists()) {
        args += ['--icon', iconFile.absolutePath]
    }
}
