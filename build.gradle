// =============================================================================
// SonarQube / SonarCloud — local pre-push static analysis matching CI.
//
// Plugin lives at the root so it aggregates analysis across all subprojects.
//
// IMPORTANT: this scan targets the *preview* SonarCloud project
// (`assofohdz_subspace-infinity-preview`), NOT the main one. The main project
// (`assofohdz_subspace-infinity`) keeps Automatic Analysis on — running the
// gradle scanner against it would conflict ("manual analysis while Automatic
// Analysis is enabled"). The preview project is dedicated to local /
// pre-push manual scans.
//
// projectKey + organization are public identifiers (visible on the SonarCloud
// project page) and committed here for convenience. The TOKEN is the secret
// — pass it via env (SONAR_TOKEN) or user-global ~/.gradle/gradle.properties:
//
//   SONAR_TOKEN=xxx ./gradlew sonar
//
// Or in ~/.gradle/gradle.properties (never the project's gradle.properties):
//   systemProp.sonar.token=xxx
//
// `sonar` depends on compile + test; it analyses real bytecode + test
// reports, matching what CI's automatic analysis does.
// =============================================================================
plugins {
    id 'org.sonarqube' version '6.0.1.5171'
}

sonar {
    properties {
        property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'https://sonarcloud.io'
        property 'sonar.organization', 'assofohdz'
        property 'sonar.projectKey', 'assofohdz_subspace-infinity-preview'
        // Skip vendored maven layout + scratch dirs from analysis.
        property 'sonar.exclusions', 'libs/m2/**,.scratch/**,.claude/**,pages/**,docs/**'
    }
}

subprojects {

    version='1.0.19'

    //Pinned to the versions Gradle currently resolves; bump deliberately
    //rather than tracking '+'. Simsilica/Moss SNAPSHOTs are vendored under
    //libs/m2 — pinning here makes the manifest explicit so a new vendored
    //artifact does not silently move the build.
    ext.jmeVersion = '3.9.0-stable'
    ext.lemurVersion = '1.17.0-SNAPSHOT'
    ext.lemurProtoVersion = '1.14.0-SNAPSHOT'
    ext.lemurPropsVersion = '1.2.0'
    ext.simMathVersion = '1.6.1-SNAPSHOT'
    ext.sio2Version = '1.9.0-SNAPSHOT'
    ext.simEtherealVersion = '1.8.1-SNAPSHOT'
    ext.zayEsVersion = '1.7.0-SNAPSHOT'
    ext.zayEsNetVersion = '1.7.0-SNAPSHOT'

    ext.groovyVersion = '3.0.25'
    ext.gsonVersion = '2.11.0'  // pinned to stable release
    ext.log4jVersion = '2.25.4'  // pinned to stable release
    ext.slf4jVersion = '2.0.17'  // pinned to stable release
    ext.guavaVersion = '33.6.0-jre'

    ext.mossVersion = '1.0.0-SNAPSHOT'

    ext.pagerVersion = '1.0.1-SNAPSHOT'
    ext.simFxVersion = '1.0.1-SNAPSHOT'

    ext.junitVersion = '4.13.2'
}